name: wf-cd-production

on:
  push:
    branches:
      - production

jobs:
  cd-build-production-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{github.ref}}
      - name: Build Website
        run: |
          npx parcel build "./src/index.html" --dist-dir "./docs" --public-url "./"
      - name: Disable Jekyll
        run: echo > ./docs/.nojekyll
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"
          name: "production-artifact"

  cd-deploy-production-job:
    needs: cd-build-production-job
    permissions:
      pages: write
      id-token: write
    environment: "production-env"
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Build Artifacts on GH Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "production-artifact"
          token: ${{ github.token }}
